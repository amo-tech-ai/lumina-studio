name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs for the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps changelog.md from drifting. Exists because it went 39 commits and 32 days
  # without covering anything new: the release-notes skill worked fine, nothing asked.
  #
  # KNOWN LIMITATION, stated so nobody rediscovers it as a bug. This measures when
  # changelog.md was last *committed*, not the newest change it *covers*. The two
  # differ: as of 2026-07-31 the file was last touched 36 commits back (3fee13b)
  # while the newest change any entry described was 39 back (aa5d433). It therefore
  # under-reports, never over-reports.
  #
  # The exploitable version: draft a changelog PR, let N code PRs land while it
  # sits in review, merge it unchanged -> `behind` resets to 0 with those N
  # unrecorded. The fix is to rebase a changelog PR onto current main before
  # merging, which is exactly GitHub's "Require branches to be up to date before
  # merging" — part of the branch protection this repo does not yet have
  # (IPI-794 · CF-GOV-001 — Protect Main with a GitHub Ruleset). Parsing a marker
  # entry would make it exact; not worth the format requirement at a drift of 3.
  #
  # This measures the BASE BRANCH, not your diff — deliberately.
  #
  # The obvious design ("this PR must touch changelog.md") was written first and
  # rejected. AGENTS.md forbids mixing docs and production files in one PR, so a
  # per-PR gate makes that rule unsatisfiable: every code PR would have to bundle a
  # docs file, and the only way out is a skip label. A gate whose normal resolution
  # is "apply the skip label" is enforcement-shaped nothing.
  #
  # Measuring `main` instead means your code PR stays code-only. The debt belongs to
  # the branch everyone shares, and anyone can clear it for everyone with a single
  # docs-only changelog PR — which is exactly the PR shape the rules want.
  #
  # No `paths:` filter, deliberately. A required check gated on changed paths can go
  # permanently "pending" on PRs that never touch them and block the merge (CLAUDE.md).
  # The push-to-main case is handled by the `github.event_name` guard below instead.
  changelog-staleness:
    runs-on: ubuntu-latest
    # Scoped explicitly rather than inherited. The label read below works today only
    # because this repo is public — a restricted default gives `pull-requests: none`,
    # and then `gh pr view --json labels` returns nothing, the grep finds no match,
    # and the break-glass label silently stops working while the gate fires anyway.
    # Job-level, not top-level: a top-level block would narrow all 8 jobs at once.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the job walks changelog.md's commits

      - name: changelog.md must not fall behind the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          # Anchored to the gap this gate exists because of: 39 commits.
          # Roughly a fortnight at this repo's merge rate. Tune after a month —
          # a threshold nobody hits is decoration, one that fires weekly is a tax.
          MAX_BEHIND: "12"
        run: |
          set -euo pipefail

          # Break-glass. Read live rather than from github.event.pull_request.labels:
          # the event payload is frozen at trigger time and `on: pull_request` has no
          # `labeled` activity type, so a payload read would mean "add the label, get
          # no re-trigger, and a manual re-run replays the same stale payload" — a red
          # check with no way to clear it. Asking the API makes "label, then re-run"
          # work without re-running all 8 jobs on every label change.
          #
          # Assigned, then tested — not piped into `grep -q`. Under `pipefail`,
          # `grep -q` exits on its first match and can SIGPIPE the upstream `gh`,
          # which the shell then reports as a failed pipeline even though the match
          # succeeded. Latent rather than observed here (the output is a few bytes
          # and fits the pipe buffer), but the failure is silent, so it is not worth
          # relying on a buffer size.
          #
          # A `gh` failure and "no label" are NOT the same thing, and collapsing them
          # is how the break-glass dies quietly. If the call fails — network, rate
          # limit, outage, or a token without `pull-requests: read` — an empty
          # `labels` makes the grep miss, the gate fires, and whoever applied
          # `no-changelog` to unblock an urgent merge gets a red check with nothing
          # to read. The `permissions:` block above removes one cause of that; it
          # does not remove the rest. So still measure on failure — never skip the
          # gate because a lookup broke — but say so out loud.
          if ! labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name'); then
            echo "::warning::Could not read labels for PR #$PR_NUMBER (gh exited non-zero). The 'no-changelog' break-glass cannot be honoured on this run — measuring anyway. If you applied the label, re-run this job."
            labels=""
          fi
          if grep -qxF 'no-changelog' <<<"$labels"; then
            echo "::notice::'no-changelog' label present — skipping."
            exit 0
          fi

          # No --depth here: a shallow fetch would truncate the history this job counts.
          git fetch --no-tags origin "$BASE_REF"

          # A PR that updates changelog.md always passes, even when the base branch
          # is already over budget. Otherwise the one PR that can clear the debt is
          # the one PR the gate blocks.
          #
          # changelog.md ONLY. SHIPPED.md was in this pattern and was wrong: this job
          # measures changelog.md staleness, so a SHIPPED-only PR would be exempted
          # from a check it does not satisfy, and merging it leaves `behind` exactly
          # where it was. The weekly SHIPPED draft is already handled properly — the
          # shipped-weekly workflow applies the `no-changelog` label to its own PR.
          #
          # Assign-then-test for the same reason as the label read above.
          #
          # `-qxF` in both places, deliberately: -x anchors to the whole line, which
          # is what `--name-only` emits, and -F takes the needle literally. The `.`
          # in "changelog.md" is a regex metacharacter, so the earlier `-qE
          # '^changelog\.md$'` needed an escape to mean what it looked like it meant.
          # -xF says the same thing with nothing to get wrong, and matching flags
          # across both checks means neither has to be re-read to be trusted.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if grep -qxF 'changelog.md' <<<"$changed"; then
            echo "✅ this PR updates changelog.md"
            exit 0
          fi

          last=$(git log -1 --format=%H "origin/$BASE_REF" -- changelog.md)
          if [ -z "$last" ]; then
            echo "::warning::changelog.md has no history on $BASE_REF — nothing to measure."
            exit 0
          fi

          behind=$(git rev-list --count "$last..origin/$BASE_REF")
          echo "changelog.md last changed at $last — $behind commit(s) ago on $BASE_REF (budget: $MAX_BEHIND)"

          if [ "$behind" -le "$MAX_BEHIND" ]; then
            echo "✅ within budget"
            exit 0
          fi

          echo "::error::changelog.md is $behind commits behind $BASE_REF (budget $MAX_BEHIND)."
          cat <<MSG

          This is not about your PR — your diff is fine, and bundling a docs file
          into it would break the one-concern rule. $BASE_REF is what's stale.

          To clear it for everyone, open a docs-only PR that brings changelog.md
          up to date:

            Draft one ........... ask Claude to "use the release-notes skill"
            Style rules ......... CHANGELOG_STYLE.md
            What's missing ...... git log --oneline $last..origin/$BASE_REF

          Genuinely blocked and need to merge now? Apply the 'no-changelog' label.
          MSG
          exit 1

  # WEB-015.1 (IPI2-160) — proves the chatbot/lead-draft RLS + claim_lead_draft
  # behavior on an ephemeral Postgres (run.sh spins postgres:16, applies only this
  # migration — not a full historical replay). Independent of build so a Docker
  # hiccup never blocks the unit pipeline. ubuntu-latest ships Docker.
  supabase-web015:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker info >/dev/null

      - name: WEB-015 RLS + claim_lead_draft tests
        run: npm run test:web015

  # Next.js operator app (app/) — standalone project with its own
  # package-lock + ESLint flat config. No real secrets required:
  # the build is static + the Mastra registry guard only checks agent keys,
  # not API key values.
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # IPI-789 · NODE-CI-001 / IPI-791 · NODE-RUNTIME-001 — Node 24 + npm 11 match
      # Vercel production (avoids the IPI-788 class of lockfile drift from CI on npm 10).
      # Pin: actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Assert Node 24 and npm 11
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version | cut -d. -f1)" = "11"

      # Fail fast if a server secret leaked into client code (app/src). Runs from
      # repo root since the scanner lives there; pure Node stdlib, no install needed.
      - name: Env guard (client secret scan)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-client-env.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # IPI-625 · CF-BASE-001 — cloudflare-env.d.ts is gitignored; generate binding-only
      # types from wrangler.jsonc on every clean checkout, then compile. Do not use
      # check:cf-types alone unless the generated file is committed.
      - name: Cloudflare binding typegen (cf-typegen)
        run: npm run cf-typegen

      # Build first: `next build` generates next-env.d.ts + .next/types for tsc.
      - name: Production build
        run: npm run build

      - name: Type-check (npm run typecheck)
        run: npm run typecheck

      # IPI-472 · INFRA-001 — verify wrangler.jsonc matches generated binding types.
      - name: Cloudflare binding types check (check:cf-types)
        run: npm run check:cf-types

      - name: Unit tests
        run: npm run test

      # IPI-472 · INFRA-001 — OpenNext Worker build + dry-run gzip gate (8.5 warn / 9.0 fail MiB).
      # Placeholder public Supabase vars — sufficient for bundle gate; fork PRs lack repo secrets.
      - name: OpenNext Cloudflare build + bundle gate (build:cf)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build:cf

  # IPI-763 · CF-CI-001 — the custom AI Gateway Worker (services/cloudflare-worker/)
  # is frozen for new features but still carries real production AI traffic
  # (see tasks/cloudflare/todo.md decision log, 2026-07-14) until IPI-592 deletes
  # it. Its 98-test @cloudflare/vitest-pool-workers suite runs fully local via
  # Miniflare — no CLOUDFLARE_API_TOKEN, account ID, or Wrangler auth needed
  # (https://developers.cloudflare.com/workers/testing/vitest-integration/).
  # No path filter, same as every other job in this file — a required check
  # gated on changed paths can go permanently "pending" on PRs that never
  # touch it and block merges (GitHub Actions required-status-check trap).
  cloudflare-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Worker tests (Vitest + vitest-pool-workers, local Miniflare)
        run: npm test

  # IPI-347 · Model Gate capstone — remote SQL + RLS when DATABASE_URL secret is set.
  # secrets.* cannot gate job-level if: — use a probe job (actions/runner#520).
  booking-gate-check:
    runs-on: ubuntu-latest
    outputs:
      db_configured: ${{ steps.check.outputs.configured }}
    steps:
      # IPI-810 · DB-TEST-001 — a pull request must never receive the production
      # credential. These scripts create fixtures and their teardown is *non-atomic*
      # (trailing statements), so any failed, timed-out or cancelled run orphans
      # auth.users / organizations rows in production permanently. ~5,653 of the
      # 5,671 rows in `brands` arrived this way.
      #
      # Pull requests therefore probe QA_DATABASE_URL only. If that secret is unset
      # the gate reports not-configured and the whole booking-gate job skips —
      # it must never quietly fall back to production.
      - id: check
        shell: bash
        env:
          PR_DB_URL: ${{ secrets.QA_DATABASE_URL }}
          PUSH_DB_URL: ${{ secrets.DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CANDIDATE="$PR_DB_URL"
          else
            CANDIDATE="$PUSH_DB_URL"
          fi

          if [ -n "$CANDIDATE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::booking-gate skipped — no database credential for event '$EVENT_NAME'. Set QA_DATABASE_URL to run it on pull requests."
          fi

  booking-gate:
    needs: booking-gate-check
    if: needs.booking-gate-check.outputs.db_configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @supabase/supabase-js's realtime-js client requires native WebSocket
      # support (stable from Node 22+) — this job constructs a real
      # createClient() against the live project, unlike the other jobs.
      # Follows app/.nvmrc (Node 24) with the operator toolchain pin.
      # Pin: actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install root dependencies (scripts/verify-rls.mjs needs @supabase/supabase-js)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Install app dependencies (typecheck + API tests in gate script)
        working-directory: app
        run: npm ci --no-audit --no-fund

      # IPI-810 · DB-TEST-001 — belt and braces. The expression below uses GitHub's
      # `cond && a || b` idiom, and an *unset secret is falsy*, so if QA_DATABASE_URL
      # is missing the expression silently yields the production URL. This step is
      # what makes that safe: on a pull request, a credential pointing at the
      # production project is a hard failure, not a fallback.
      #
      # Do not remove this because "the check job already handles it" — the check job
      # guards which credential is *probed*; this guards which one is actually *used*.
      #
      # IPI-810 phase 2 — this originally checked the Postgres URL only, which left the
      # API path open: verify-rls.mjs writes through NEXT_PUBLIC_SUPABASE_URL plus the
      # service-role key, so a run could be refused on the connection string and still
      # create production rows over HTTP. Both credentials are checked now.
      - name: Refuse the production project on pull requests
        shell: bash
        env:
          RESOLVED_DB_URL: ${{ github.event_name == 'pull_request' && secrets.QA_DATABASE_URL || secrets.DATABASE_URL }}
          # Inverted for the same reason as the Model Gate step below: a falsy middle operand
          # would resolve to the production URL here and fail every pull request.
          RESOLVED_API_URL: ${{ github.event_name != 'pull_request' && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PROD_REF="nvdlhrodvevgwdsneplk"
          [ "$EVENT_NAME" = "pull_request" ] || {
            echo "Target check skipped for event '$EVENT_NAME' (production is the intended target)."
            exit 0
          }
          for pair in "Postgres URL:$RESOLVED_DB_URL" "Supabase API URL:$RESOLVED_API_URL"; do
            label="${pair%%:*}"
            value="${pair#*:}"
            if printf '%s' "$value" | grep -q "$PROD_REF"; then
              echo "::error::booking-gate resolved the PRODUCTION project ($PROD_REF) in the $label on a pull request. Refusing — these tests write fixtures with non-atomic teardown. Point QA_DATABASE_URL at a QA project or Supabase branch; production API credentials are never routed to pull requests."
              exit 1
            fi
          done
          echo "Target check passed: production ref absent from both the Postgres URL and the Supabase API URL."

      # IPI-892 · CI-QA-NET-001 — `db.<ref>.supabase.co` resolves to IPv6 only, and
      # GitHub-hosted runners have no IPv6 route, so psql dies at TCP connect with
      # "Network is unreachable" — a message that names no cause and no fix. It is
      # also the exact hostname the Supabase dashboard shows first, so this is the
      # default mistake, not an exotic one: QA_DATABASE_URL was wired that way on
      # 2026-08-01 and every pull request touching supabase/** went red.
      #
      # The Supavisor pooler (aws-N-<region>.pooler.supabase.com) is the IPv4 path.
      # Port 5432 is session mode, which these scripts need — 6543 is transaction
      # mode and drops SET ROLE / advisory locks between statements.
      - name: Refuse an IPv6-only direct database host
        shell: bash
        env:
          RESOLVED_DB_URL: ${{ github.event_name == 'pull_request' && secrets.QA_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          if printf '%s' "$RESOLVED_DB_URL" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::booking-gate's database URL uses the direct host db.<ref>.supabase.co, which is IPv6-only and unreachable from GitHub runners. Use the Supavisor pooler instead: postgresql://postgres.<ref>:<password>@aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require"
            exit 1
          fi
          echo "Host check passed: database URL is not a direct IPv6-only host."

      # IPI-810 phase 2 — routing DATABASE_URL to QA is not sufficient on its own.
      # scripts/verify-booking-gate.mjs also spawns scripts/verify-rls.mjs, which
      # builds a createClient() from the *API* credentials below and creates real
      # auth.users / organizations / brands rows. Those secrets have no QA variant,
      # so on a pull request they are withheld entirely and the probe is skipped via
      # --skip-api. Withholding and skipping are deliberately both applied: the skip
      # states the intent, the empty credentials make it structural, so a future edit
      # that re-enables the probe still cannot reach production.
      - name: Model Gate verification
        env:
          REQUIRE_BOOKING_SQL: "1"
          DATABASE_URL: ${{ github.event_name == 'pull_request' && secrets.QA_DATABASE_URL || secrets.DATABASE_URL }}
          # The condition is INVERTED so the secret sits in the middle operand. GitHub's
          # `a && b || c` returns operand values, not booleans, so a falsy middle operand
          # (`== 'pull_request' && ''`) always falls through to c — that spelling hands pull
          # requests the production secret, the exact opposite of the intent. Written this
          # way a pull request yields '' and only a push resolves the secret.
          # booking-gate-prod-isolation.test.ts fails the build on a falsy middle operand in
          # any ${{ }} expression in this file (comments like this one are not scanned).
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name != 'pull_request' && secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          # Trust Supabase pooler CA (scripts/certs/supabase-prod-ca-2021.crt).
          # Do not set VERIFY_RLS_PG_INSECURE_SSL in CI (IPI-621).
          PGSSLROOTCERT: ${{ github.workspace }}/scripts/certs/supabase-prod-ca-2021.crt
          # Resolved here rather than interpolated into `run:` below. A ${{ }} expansion inside
          # a shell script is the template-injection shape zizmor flags, and this repo already
          # states the rule for QA_PASSWORD in shoot-wizard-e2e: read the value through env so
          # the shell never re-parses it. The value is a fixed literal keyed on
          # github.event_name, so it was not exploitable — but the shape is worth not teaching.
          # Middle operand is truthy ('--skip-api'), which is the correct spelling; see the
          # credential note above for why a falsy middle operand would invert the meaning.
          SKIP_API_FLAG: ${{ github.event_name == 'pull_request' && '--skip-api' || '' }}
        # Unquoted so an empty value disappears via word-splitting instead of becoming an
        # empty argv entry.
        run: npm run supabase:verify-booking-gate -- ${SKIP_API_FLAG}

      # IPI-476 · PLAN-CI-001 — planner scenario + Realtime (needs Node 22+ WebSocket)
      # IPI-810 phase 2 — push only. This step never had a target guard at all: it takes
      # production API credentials directly and verify-planner-scenario.mjs writes fixtures,
      # so on a pull request it is not run.
      #
      # The credentials below are deliberately left unconditional, unlike the Model Gate
      # step's: the `if:` means this step never executes on a pull request, so there is no
      # pull-request value for them to resolve to. Do not "make it consistent" by adding an
      # event ternary here — that would imply this step can run on a pull request. If the
      # `if:` is ever removed, these must become conditional in the same edit.
      - name: Planner scenario + Realtime verification
        if: github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run supabase:verify-planner

  # IPI-674 · QA-SHOOT-001 — real-browser proof of the Shoot Wizard happy path.
  # Every AI/workflow/commit call is intercepted (see e2e/08-shoot-wizard.spec.ts),
  # but login is real, so a real QA_PASSWORD is required. This job fails loudly
  # if that secret is missing rather than letting the suite report a quiet,
  # misleadingly-green "skipped" run.
  shoot-wizard-e2e:
    runs-on: ubuntu-latest
    # Fork PRs never receive repo secrets (GitHub platform behavior, not
    # something a workflow can opt into) — skip cleanly for them instead of
    # hard-failing every external/Dependabot PR on a secret they can never
    # have. Same-repo pushes and PRs still run and still hard-fail below if
    # QA_PASSWORD is missing there, where it's expected to be configured.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Verify QA credentials are configured
        # Read the secret through env, not interpolated directly into the
        # shell script via ${{ }} — a value containing $, quotes, or other
        # shell metacharacters would otherwise be re-expanded/reparsed by
        # the shell before this check runs (e.g. a password starting with
        # "$" could look empty), giving a false "missing" failure or worse.
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          if [ -z "$QA_PASSWORD" ]; then
            echo "::error::QA_PASSWORD secret is not set — failing rather than letting this job silently skip the real login."
            exit 1
          fi

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Shoot Wizard e2e (chromium-desktop)
        # Least privilege: QA_PASSWORD + the public anon key/URL are all a
        # real client-side login needs. Every AI/workflow/commit/brand-read
        # call this spec makes is intercepted via page.route(), so the app
        # never exercises a server-side DB path — no service-role key or
        # direct DB connection string belongs in this job.
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx playwright test e2e/08-shoot-wizard.spec.ts --project=chromium-desktop

      - name: Upload failure evidence (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shoot-wizard-e2e-failure
          path: test-results/
          retention-days: 7

  # IPI-701 · QA-PREVIEW-001 — real-browser proof of the Channel Preview
  # read path. Unlike shoot-wizard-e2e, this page makes zero client-side
  # network calls: getAllChannelSpecs() runs server-side during SSR, so
  # there's nothing to mock and no mutation risk — this spec deliberately
  # exercises the real Supabase-backed query end to end. Same QA_PASSWORD
  # fail-loud contract as shoot-wizard-e2e (see comment above).
  channel-preview-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Verify QA credentials are configured
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          if [ -z "$QA_PASSWORD" ]; then
            echo "::error::QA_PASSWORD secret is not set — failing rather than letting this job silently skip the real login."
            exit 1
          fi

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Channel Preview e2e (chromium-desktop)
        # Least privilege: QA_PASSWORD + the public anon key/URL are all a
        # real client-side login needs. getAllChannelSpecs() reads through
        # the anon key + the authenticated session cookie under RLS — no
        # service-role key or direct DB connection string belongs here.
        env:
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx playwright test e2e/09-channel-preview.spec.ts --project=chromium-desktop

      - name: Upload failure evidence (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: channel-preview-e2e-failure
          path: test-results/
          retention-days: 7
