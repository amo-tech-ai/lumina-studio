# IPI-668 · SB-TEST-001 — Required verify-rls + chatbot grant asserts on trusted CI.
# Separate from supabase-linked-gates.yml (different secrets + concurrency).
# Never pull_request_target. No path filters (required-check safe).
name: Supabase verify-rls

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Shared remote project — serialize; never cancel mid-cleanup.
  group: supabase-verify-rls-nvdlhrodvevgwdsneplk
  cancel-in-progress: false

jobs:
  supabase-verify-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trust + secrets gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          # Pull requests resolve the QA project; only push-to-main resolves production.
          #
          # Both candidate sets are passed in as separate variables and chosen in bash.
          # Do NOT collapse this into `github.event_name == 'pull_request' && secrets.QA_X
          # || secrets.X`: an unset secret is falsy, so that expression silently resolves
          # to the PRODUCTION secret exactly when the QA one is missing — the one case the
          # guard exists for. IPI-810 phase 1 shipped that spelling and it took a second
          # pass to catch.
          PR_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          PR_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          PR_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          PR_DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          PUSH_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PUSH_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PUSH_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Alias some orgs already store as SUPABASE_DB_URL (production only).
          PUSH_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          trusted=false
          if [ "$EVENT_NAME" = "push" ]; then
            trusted=true
          elif [ "$EVENT_NAME" = "pull_request" ] \
            && [ "${PR_HEAD_REPO:-}" = "$REPO" ] \
            && [ "$ACTOR" != "dependabot[bot]" ]; then
            trusted=true
          fi

          if [ "$trusted" != "true" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Explicit safe skip: fork or Dependabot PR (no secrets)."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET="QA"
            SUPABASE_URL="$PR_SUPABASE_URL"
            SUPABASE_ANON_KEY="$PR_SUPABASE_ANON_KEY"
            SERVICE_ROLE_KEY="$PR_SERVICE_ROLE_KEY"
            DATABASE_URL="$PR_DATABASE_URL"
          else
            TARGET="production"
            SUPABASE_URL="$PUSH_SUPABASE_URL"
            SUPABASE_ANON_KEY="$PUSH_SUPABASE_ANON_KEY"
            SERVICE_ROLE_KEY="$PUSH_SERVICE_ROLE_KEY"
            DATABASE_URL="$PUSH_DATABASE_URL"
            # Prefer DATABASE_URL; accept SUPABASE_DB_URL as the same connection string.
            if [ -n "${DATABASE_URL:-}" ] && [ -n "${PUSH_SUPABASE_DB_URL:-}" ] \
              && [ "$DATABASE_URL" != "$PUSH_SUPABASE_DB_URL" ]; then
              echo "::error::DATABASE_URL and SUPABASE_DB_URL both set but differ — refuse ambiguous DB target"
              exit 1
            fi
            if [ -z "${DATABASE_URL:-}" ] && [ -n "${PUSH_SUPABASE_DB_URL:-}" ]; then
              DATABASE_URL="$PUSH_SUPABASE_DB_URL"
            fi
          fi

          # A pull request missing *any* QA credential skips rather than falling back
          # to production or failing red. booking-gate / changelog note that the API
          # secrets may not have QA variants yet — if only QA_DATABASE_URL is set, we
          # must not hard-fail. The job still posts a conclusion, so this stays safe
          # on a required-checks list (IPI-895).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ] \
              || [ -z "${SERVICE_ROLE_KEY:-}" ] || [ -z "${DATABASE_URL:-}" ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "::notice::supabase-verify-rls skipped — one or more QA_* secrets unset (QA_SUPABASE_URL, QA_SUPABASE_ANON_KEY, QA_SUPABASE_SERVICE_ROLE_KEY, QA_DATABASE_URL). Never falls back to production on a pull request."
              exit 0
            fi
          fi

          # IPI-810 · DB-TEST-001, applied here. `npm run supabase:verify-rls` is not a
          # read-only probe: verify-rls.mjs calls auth.admin.createUser(), signUp(), and
          # inserts into brands / assets / events / notifications, with non-atomic
          # teardown. A cancelled or timed-out run orphans those rows permanently — the
          # mechanism behind ~5,653 of the 5,671 junk rows in `brands`. Both the Postgres
          # URL and the Supabase API URL are checked, because the fixtures reach the
          # database over HTTP as well as over psql.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PROD_REF="nvdlhrodvevgwdsneplk"
            for pair in "Postgres URL:$DATABASE_URL" "Supabase API URL:${SUPABASE_URL:-}"; do
              label="${pair%%:*}"
              value="${pair#*:}"
              if printf '%s' "$value" | grep -q "$PROD_REF"; then
                echo "::error::supabase-verify-rls resolved the PRODUCTION project ($PROD_REF) in the $label on a pull request. Refusing — verify-rls.mjs writes fixtures with non-atomic teardown. Point QA_SUPABASE_URL / QA_DATABASE_URL at the QA project."
                exit 1
              fi
            done
            echo "Target check passed: production ref absent from both the Postgres URL and the Supabase API URL."
          fi

          missing=()
          [ -n "${SUPABASE_URL:-}" ] || missing+=("SUPABASE_URL")
          [ -n "${SUPABASE_ANON_KEY:-}" ] || missing+=("SUPABASE_ANON_KEY")
          [ -n "${SERVICE_ROLE_KEY:-}" ] || missing+=("SERVICE_ROLE_KEY")
          [ -n "${DATABASE_URL:-}" ] || missing+=("DATABASE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Trusted CI missing required $TARGET secrets: ${missing[*]}"
            exit 1
          fi

          # Mask before any output/env write so logs cannot echo them later.
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          # Only the Postgres URL is global (psql / pgTAP / supabase test db).
          # API + service-role keys stay OUT of GITHUB_ENV so `npm ci` lifecycle
          # scripts never see them — they are scoped to the verify-rls step via
          # step outputs (below).
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SUPABASE_DB_URL=$DATABASE_URL"
          } >> "$GITHUB_ENV"

          # Single resolution point for API credentials. The verify-rls step reads
          # these from steps.gate.outputs — never re-derive from secrets.* there
          # (a step-level secrets.* env: would re-pin that step to production).
          {
            echo "supabase_url=$SUPABASE_URL"
            echo "supabase_anon_key=$SUPABASE_ANON_KEY"
            echo "service_role_key=$SERVICE_ROLE_KEY"
            echo "target=$TARGET"
            echo "mode=run"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved target: $TARGET"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.mode == 'run'
        with:
          node-version: "22"
          cache: npm

      - name: Install root deps (supabase-js)
        if: steps.gate.outputs.mode == 'run'
        run: npm ci --omit=dev

      # IPI-245 runtime probe loads `pg` via createRequire(app/package.json).
      # Root npm ci does not populate app/node_modules.
      - name: Install app deps (pg for Mastra runtime probe)
        if: steps.gate.outputs.mode == 'run'
        working-directory: app
        run: npm ci --omit=dev

      - name: Install postgresql-client
        if: steps.gate.outputs.mode == 'run'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Pin action commit (supply-chain); CLI binary still pinned via version below.
      # SHA = tip of supabase/setup-cli@v1 as of 2026-05-21 (ab058987).
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        if: steps.gate.outputs.mode == 'run'
        with:
          # Pin to the CLI version used for the linked gates job (IPI-665).
          version: 2.109.1

      # DB URL from gate → GITHUB_ENV (canonical DATABASE_URL = SUPABASE_DB_URL).
      - name: Chatbot / lead_intake grant assertions
        if: steps.gate.outputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security/chatbot-grants.sql

      - name: SECURITY DEFINER RPC grant assertions (IPI-679)
        if: steps.gate.outputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security/definer-grants.sql

      - name: Default EXECUTE privileges on new functions (IPI-684)
        if: steps.gate.outputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security/default-execute-privileges.sql

      # IPI-896 · SB-SEC-008 — the table/sequence counterpart of the step above.
      # Runs inside a transaction that always rolls back, so a failing assertion
      # cannot leak its probe objects into the shared remote project.
      - name: Default table/sequence privileges on new objects (IPI-896)
        if: steps.gate.outputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security/default-table-privileges.sql

      - name: pgTAP — RLS/grant/policy structural tests (IPI-245 · SB-TEST-002)
        if: steps.gate.outputs.mode == 'run'
        env:
          # Explicit QA vs production for 004 — do not infer from catalog count
          # (a restored 33-table public.mastra_* set on prod must still fail).
          IPIX_VERIFY_TARGET: ${{ steps.gate.outputs.target }}
        run: |
          set -euo pipefail
          case "${IPIX_VERIFY_TARGET}" in
            QA|qa) guc=qa ;;
            production|prod) guc=production ;;
            *)
              echo "::error::pgTAP needs explicit QA/production target, got '${IPIX_VERIFY_TARGET}'"
              exit 1
              ;;
          esac
          # Custom GUC must contain a dot. supabase test db / psql inherit PGOPTIONS.
          export PGOPTIONS="${PGOPTIONS:+$PGOPTIONS }-c app.ipix_verify_target=${guc}"
          supabase test db --db-url "$DATABASE_URL" supabase/tests/database

      - name: verify-rls (fail-closed service role)
        if: steps.gate.outputs.mode == 'run'
        env:
          # API + service-role from gate outputs only (QA on PR, prod on push).
          # Do NOT redeclare these as `secrets.*` — that re-pins this step to
          # production while psql steps stay on the gate's DATABASE_URL.
          # DATABASE_URL / SUPABASE_DB_URL arrive from GITHUB_ENV (Postgres only).
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.gate.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.gate.outputs.supabase_anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.gate.outputs.service_role_key }}
          REQUIRE_SERVICE_ROLE: "1"
          # IPI-245 — fail-closed runtime-role probe. Prefers HYPERDRIVE_DATABASE_URL when
          # present; otherwise uses DATABASE_URL + SET ROLE hyperdrive_mastra_runtime.
          # No QA counterpart secret exists, so on a pull request this is empty and the
          # probe falls back to the QA DATABASE_URL above. `SET ROLE` needs session mode:
          # QA_DATABASE_URL must stay on the pooler's :5432, not :6543.
          HYPERDRIVE_DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.HYPERDRIVE_DATABASE_URL || '' }}
          # Same reasoning as HYPERDRIVE_DATABASE_URL: production-only, empty on a PR so
          # the probe uses the QA connection the gate resolved.
          MASTRA_DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.MASTRA_DATABASE_URL || '' }}
          REQUIRE_HYPERDRIVE_RUNTIME_PROBE: "1"
          # Trust Supabase pooler CA (Dashboard SSL Configuration / prod-ca-2021).
          # Do not set VERIFY_RLS_PG_INSECURE_SSL in CI (IPI-621).
          PGSSLROOTCERT: ${{ github.workspace }}/scripts/certs/supabase-prod-ca-2021.crt
        run: |
          set -euo pipefail
          npm run supabase:verify-rls
