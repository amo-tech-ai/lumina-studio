# IPI-827 · CF-DB-009f — Preview Hyperdrive canary capacity matrix (diagnostics)
#
# External VUs only + body mode:"single". Uses GitHub secret INTERNAL_WEBHOOK_SECRET.
# Does not print secret values. Uploads JSON summary artifact for Linear evidence.
#
# Manual only — do not schedule. Disable canary after the run (IPI-828 runbook).

name: IPI-827 Hyperdrive capacity matrix

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Requests per concurrency stage (default 50)
        required: false
        default: "50"
      warmup:
        description: Warm-up requests before baseline
        required: false
        default: "8"
      cooldown_sec:
        description: Cooldown seconds between concurrency 2 and 3
        required: false
        default: "30"
      max_concurrency:
        description: Highest external concurrency to test (1–3)
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  capacity-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe canary enabled (expect 401 with dummy secret)
        run: |
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
            "https://ipix-operator-preview.sk-498.workers.dev/api/internal/hyperdrive-thread-canary" \
            -H 'content-type: application/json' \
            -H 'X-Internal-Secret: not-the-real-secret' \
            -H 'user-agent: ipix-ipi-827-capacity/1.0' \
            -d '{"mode":"single","resourceId":"org_capacity_test"}')
          echo "probe_http=$code"
          cat /tmp/probe.json
          if [ "$code" = "404" ]; then
            echo "::error::Canary flag appears OFF (404). Enable ENABLE_HYPERDRIVE_THREAD_CANARY=true, secrets-sync + promote, then re-run."
            exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::warning::Expected 401 for dummy secret; got $code — continuing if matrix can auth."
          fi

      - name: Run external VU capacity matrix
        env:
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          COOLDOWN_SEC: ${{ inputs.cooldown_sec }}
          MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          CANARY_URL: https://ipix-operator-preview.sk-498.workers.dev/api/internal/hyperdrive-thread-canary
        run: |
          node <<'NODE'
          const fs = require("fs");
          const url = process.env.CANARY_URL;
          const secret = process.env.INTERNAL_WEBHOOK_SECRET;
          if (!secret) {
            console.error("INTERNAL_WEBHOOK_SECRET missing");
            process.exit(1);
          }
          const iterations = Math.max(1, Number(process.env.ITERATIONS || 50));
          const warmup = Math.max(1, Number(process.env.WARMUP || 8));
          const cooldownSec = Math.max(0, Number(process.env.COOLDOWN_SEC || 30));
          const maxConcurrency = Math.min(3, Math.max(1, Number(process.env.MAX_CONCURRENCY || 3)));
          const body = JSON.stringify({ mode: "single", resourceId: "org_capacity_test" });

          function percentile(sorted, p) {
            if (!sorted.length) return null;
            const idx = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
            return sorted[idx];
          }

          async function oneRequest(label, i) {
            const t0 = Date.now();
            let status = 0;
            let error = null;
            let matched = null;
            let crossTenant = null;
            let requestId = null;
            let bodyPreview = "";
            try {
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "X-Internal-Secret": secret,
                  "user-agent": "ipix-ipi-827-capacity/1.0",
                },
                body,
              });
              status = res.status;
              const text = await res.text();
              bodyPreview = text.slice(0, 240);
              try {
                const j = JSON.parse(text);
                error = j.error ?? null;
                matched = typeof j.matched === "boolean" ? j.matched : null;
                crossTenant = typeof j.crossTenant === "boolean" ? j.crossTenant : null;
                requestId = j.requestId ?? null;
              } catch {
                error = status === 503 ? "empty_or_non_json_503" : "non_json_body";
              }
            } catch (e) {
              status = 0;
              error = `network:${e && e.message ? e.message : String(e)}`;
            }
            const ms = Date.now() - t0;
            return { label, i, status, ms, error, matched, crossTenant, requestId, bodyPreview };
          }

          async function runPool(label, n, concurrency) {
            const results = [];
            let next = 0;
            async function worker() {
              while (true) {
                const i = next++;
                if (i >= n) return;
                results.push(await oneRequest(label, i));
              }
            }
            const workers = Array.from({ length: concurrency }, () => worker());
            await Promise.all(workers);
            results.sort((a, b) => a.i - b.i);
            return results;
          }

          function summarize(label, concurrency, results) {
            const lat = results.map((r) => r.ms).sort((a, b) => a - b);
            const byStatus = {};
            const byError = {};
            let ok = 0;
            let crossTenant = 0;
            const failures = [];
            for (const r of results) {
              byStatus[r.status] = (byStatus[r.status] || 0) + 1;
              const key = r.error || (r.status >= 200 && r.status < 300 ? "ok" : `http_${r.status}`);
              byError[key] = (byError[key] || 0) + 1;
              if (r.status >= 200 && r.status < 300 && r.matched === true && r.crossTenant === false) ok++;
              if (r.crossTenant === true) crossTenant++;
              if (r.status === 503 || r.status === 0 || r.status >= 500) {
                failures.push({
                  i: r.i,
                  status: r.status,
                  error: r.error,
                  ms: r.ms,
                  requestId: r.requestId,
                  bodyPreview: r.bodyPreview,
                });
              }
            }
            return {
              label,
              concurrency,
              n: results.length,
              ok,
              fail: results.length - ok,
              crossTenant,
              byStatus,
              byError,
              p50_ms: percentile(lat, 50),
              p95_ms: percentile(lat, 95),
              p99_ms: percentile(lat, 99),
              max_ms: lat[lat.length - 1] ?? null,
              failures,
            };
          }

          (async () => {
            const startedAt = new Date().toISOString();
            const stages = [];

            console.log(`warmup n=${warmup} concurrency=1`);
            const warm = await runPool("warmup", warmup, 1);
            stages.push(summarize("warmup", 1, warm));
            console.log(JSON.stringify(stages[stages.length - 1], null, 0));

            for (let c = 1; c <= maxConcurrency; c++) {
              if (c === 3 && cooldownSec > 0) {
                console.log(`cooldown ${cooldownSec}s before concurrency 3`);
                await new Promise((r) => setTimeout(r, cooldownSec * 1000));
              }
              console.log(`stage concurrency=${c} n=${iterations}`);
              const res = await runPool(`c${c}`, iterations, c);
              const summary = summarize(`c${c}`, c, res);
              stages.push(summary);
              console.log(
                JSON.stringify({
                  label: summary.label,
                  concurrency: summary.concurrency,
                  ok: summary.ok,
                  fail: summary.fail,
                  crossTenant: summary.crossTenant,
                  byStatus: summary.byStatus,
                  byError: summary.byError,
                  p50_ms: summary.p50_ms,
                  p95_ms: summary.p95_ms,
                  failure_count: summary.failures.length,
                })
              );
            }

            // Capacity decision heuristic (documented; final decision after Observability)
            let accepted = 1;
            for (const s of stages) {
              if (!/^c\d+$/.test(s.label)) continue;
              const resourceFail = (s.byError.empty_or_non_json_503 || 0) + (s.byError.non_json_body || 0);
              const appSat = s.byError.concurrency_saturated || 0;
              const other503 = (s.byStatus[503] || 0) - appSat - resourceFail;
              const hardFail = resourceFail + Math.max(0, other503) + (s.byStatus[0] || 0);
              if (s.fail === 0 && s.crossTenant === 0) accepted = s.concurrency;
              else if (hardFail === 0 && appSat > 0 && s.crossTenant === 0) {
                // App semaphore only — still not production-safe above serial unless 0 fail
                break;
              } else {
                break;
              }
            }

            const report = {
              issue: "IPI-827",
              startedAt,
              finishedAt: new Date().toISOString(),
              canaryUrl: url,
              body: { mode: "single", resourceId: "org_capacity_test" },
              iterations,
              warmup,
              cooldownSec,
              maxConcurrency,
              stages,
              preliminary_concurrency_accepted_for_ipi_803: accepted,
              note:
                "Correlate 503 failures with Workers Observability (exceededCpu/exceededMemory) before final capacity decision. App concurrency_saturated is Case A.",
            };
            fs.mkdirSync("artifacts", { recursive: true });
            fs.writeFileSync("artifacts/ipi-827-capacity-report.json", JSON.stringify(report, null, 2));
            console.log(
              "PRELIMINARY_CAPACITY=" + accepted + " total_failures=" +
                stages.reduce((n, s) => n + s.failures.length, 0)
            );
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Upload capacity report
        uses: actions/upload-artifact@v4
        with:
          name: ipi-827-capacity-report
          path: artifacts/ipi-827-capacity-report.json
          if-no-files-found: error
