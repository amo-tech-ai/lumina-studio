# IPI-472 + IPI-606 — Worker bootstrap (manual)
#
# Correct order (OpenNext + secrets.required):
#   validate → fetch secrets → build:cf → upload+secrets-file (one version) → record version ID
#
# dry_run=true: validate pairing + list secret names only (no build/upload).
# dry_run=false: full bootstrap — code and runtime secrets in a single Worker version.
#
# IPI-825 · CF-DEPLOY-031 — after preview upload, optionally promote VERSION_ID@100
# (skipped for dry_run and production; production promotion stays manual).
# Job concurrency is per wrangler_env so overlapping preview dispatches cannot
# promote an older VERSION_ID after a newer one already went live.
#
# IPI-632 smoke validation runs separately after preview URL exists.
#
# Docs: app/docs/infisical-cloudflare-secrets.md · app/docs/opennext-ci.md

name: Cloudflare secrets sync

on:
  workflow_dispatch:
    inputs:
      secret_source:
        description: Where runtime secret values come from
        required: true
        type: choice
        options:
          - github
          - infisical-oidc
      infisical_env:
        description: Infisical env slug (dev | staging | prod) — pairing label for github/infisical
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      wrangler_env:
        description: Wrangler environment (preview | production)
        required: true
        type: choice
        options:
          - preview
          - production
      dry_run:
        description: Dry run (names only — skip build, upload, and wrangler sync)
        required: false
        type: boolean
        default: true
      promote_preview:
        description: After preview upload, promote VERSION_ID to 100% traffic (ignored for dry_run / production)
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  worker-bootstrap:
    runs-on: ubuntu-latest
    # Serialize per env: cancel-in-progress=false so an in-flight upload finishes
    # before the next dispatch promotes (avoids stale VERSION_ID@100 races).
    concurrency:
      group: cloudflare-secrets-sync-${{ inputs.wrangler_env }}
      cancel-in-progress: false
    environment: ${{ inputs.wrangler_env }}
    defaults:
      run:
        working-directory: app
    env:
      INFISICAL_ENV: ${{ inputs.infisical_env }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
      DRY_RUN: ${{ inputs.dry_run }}
      SECRET_SOURCE: ${{ inputs.secret_source }}
      # CF-DEPLOY-030: non-secret Worker config — GitHub environment variables → upload --var (not Dashboard).
      INTELLIGENCE_API_URL: ${{ vars.INTELLIGENCE_API_URL }}
      INTELLIGENCE_GATEWAY_WS_URL: ${{ vars.INTELLIGENCE_GATEWAY_WS_URL }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
      # IPI-586 — optional; set preview GitHub env var to "true" only for smoke proof.
      ENABLE_CF_AI_SMOKE: ${{ vars.ENABLE_CF_AI_SMOKE }}
      # IPI-822 · CF-DB-009b — optional; set preview GitHub env var to "true" only for thread canary.
      ENABLE_HYPERDRIVE_THREAD_CANARY: ${{ vars.ENABLE_HYPERDRIVE_THREAD_CANARY }}
      # IPI-607 · CF-MIG-230-FLAGS — optional per-agent native|legacy (unset → legacy).
      AI_ROUTING_AGENT_PUBLIC_MARKETING: ${{ vars.AI_ROUTING_AGENT_PUBLIC_MARKETING }}
      AI_ROUTING_AGENT_PRODUCTION_PLANNER: ${{ vars.AI_ROUTING_AGENT_PRODUCTION_PLANNER }}
      AI_ROUTING_AGENT_CREATIVE_DIRECTOR: ${{ vars.AI_ROUTING_AGENT_CREATIVE_DIRECTOR }}
      AI_ROUTING_AGENT_VISUAL_IDENTITY: ${{ vars.AI_ROUTING_AGENT_VISUAL_IDENTITY }}
      AI_ROUTING_AGENT_SOCIAL_DISCOVERY: ${{ vars.AI_ROUTING_AGENT_SOCIAL_DISCOVERY }}
      AI_ROUTING_AGENT_BRAND_INTELLIGENCE: ${{ vars.AI_ROUTING_AGENT_BRAND_INTELLIGENCE }}
      AI_ROUTING_AGENT_MODEL_MATCH: ${{ vars.AI_ROUTING_AGENT_MODEL_MATCH }}
      AI_ROUTING_AGENT_CRM_ASSISTANT: ${{ vars.AI_ROUTING_AGENT_CRM_ASSISTANT }}
      AI_ROUTING_AGENT_BOOKING: ${{ vars.AI_ROUTING_AGENT_BOOKING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Infisical ↔ wrangler env pairing
        run: node scripts/validate-env-pair.mjs

      - name: Validate Infisical OIDC configuration
        run: node scripts/validate-infisical-oidc-config.mjs

      - name: Authenticate to Infisical (OIDC)
        if: inputs.secret_source == 'infisical-oidc'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV }}

      # --- Dry run: names only (no build/upload) ---------------------------------
      - name: Dry-run secret allowlist (GitHub source)
        if: inputs.secret_source == 'github' && inputs.dry_run == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # IPI-824 / IPI-826 — DATABASE_URL seeds Wrangler Hyperdrive local connection
          # (CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_FRESH) inside
          # upload-opennext-with-secrets.mjs, appending sslmode=require when absent.
          # Never print or commit the connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_NOTIFICATION_API_SECRET: ${{ secrets.CLOUDINARY_NOTIFICATION_API_SECRET }}
          COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
          INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          CAPTURE_LEAD_PROXY_SECRET: ${{ secrets.CAPTURE_LEAD_PROXY_SECRET }}
        run: |
          node scripts/upload-opennext-with-secrets.mjs \
            --infisical-env "$INFISICAL_ENV" --wrangler-env "$WRANGLER_ENV" --dry-run

      - name: Dry-run secret allowlist (Infisical OIDC)
        if: inputs.secret_source == 'infisical-oidc' && inputs.dry_run == true
        run: |
          # IPI-824 / IPI-826 — upload script derives Hyperdrive local connection + TLS from DATABASE_URL.
          node scripts/upload-opennext-with-secrets.mjs \
            --infisical-env "$INFISICAL_ENV" --wrangler-env "$WRANGLER_ENV" --dry-run

      # --- Live bootstrap (skipped on dry_run) -----------------------------------
      - name: Cloudflare binding typegen (cf-typegen)
        if: inputs.dry_run == false
        run: npm run cf-typegen

      # Build-time public values: GitHub environment variables (preferred), secrets fallback.
      # Same source as BUILD_TIME_SECRET_NAMES — never synced to Worker runtime secrets.
      - name: OpenNext build (build:cf)
        if: inputs.dry_run == false
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:cf

      # Code + runtime secrets in one version (wrangler --secrets-file passthrough).
      # Greenfield: script falls back to deploy when Worker script does not exist yet.
      - name: Upload Worker with runtime secrets (GitHub source)
        if: inputs.dry_run == false && inputs.secret_source == 'github'
        id: upload_github
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # IPI-824 / IPI-826 — DATABASE_URL → Hyperdrive local connection + sslmode=require
          # inside upload-opennext-with-secrets.mjs (never print / commit the string).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_NOTIFICATION_API_SECRET: ${{ secrets.CLOUDINARY_NOTIFICATION_API_SECRET }}
          COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
          INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          CAPTURE_LEAD_PROXY_SECRET: ${{ secrets.CAPTURE_LEAD_PROXY_SECRET }}
        run: |
          set -o pipefail
          OUTPUT=$(node scripts/upload-opennext-with-secrets.mjs \
            --infisical-env "$INFISICAL_ENV" --wrangler-env "$WRANGLER_ENV" 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$OUTPUT" | sed -n 's/^worker_version_id=//p' | tail -1)
          PREVIEW_URL=$(echo "$OUTPUT" | sed -n 's/^preview_url=//p' | tail -1)
          echo "worker_version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Upload Worker with runtime secrets (Infisical OIDC)
        if: inputs.dry_run == false && inputs.secret_source == 'infisical-oidc'
        id: upload_infisical
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # IPI-824 / IPI-826 — upload script derives Hyperdrive local connection + TLS from DATABASE_URL.
          OUTPUT=$(node scripts/upload-opennext-with-secrets.mjs \
            --infisical-env "$INFISICAL_ENV" --wrangler-env "$WRANGLER_ENV" 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$OUTPUT" | sed -n 's/^worker_version_id=//p' | tail -1)
          PREVIEW_URL=$(echo "$OUTPUT" | sed -n 's/^preview_url=//p' | tail -1)
          echo "worker_version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      # IPI-825 · CF-DEPLOY-031 — upload creates a version; preview traffic needs an explicit promote.
      # Official: wrangler versions deploy <id>@100 — https://developers.cloudflare.com/workers/wrangler/commands/workers/#versions-deploy
      - name: Promote preview Worker version to 100% traffic (IPI-825)
        if: >
          inputs.dry_run == false &&
          inputs.wrangler_env == 'preview' &&
          inputs.promote_preview == true
        id: promote_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          GH_VERSION_ID="${{ steps.upload_github.outputs.worker_version_id }}"
          INF_VERSION_ID="${{ steps.upload_infisical.outputs.worker_version_id }}"
          VERSION_ID="${GH_VERSION_ID:-${INF_VERSION_ID:-}}"
          if [ -z "$VERSION_ID" ]; then
            EXPECTED_STEP="upload_github"
            if [ "${SECRET_SOURCE}" = "infisical-oidc" ]; then
              EXPECTED_STEP="upload_infisical"
            fi
            echo "Error: VERSION_ID empty — cannot promote preview Worker version." >&2
            echo "Expected non-empty worker_version_id from step '${EXPECTED_STEP}' (secret_source=${SECRET_SOURCE})." >&2
            echo "upload_github.worker_version_id='${GH_VERSION_ID:-<unset>}' upload_infisical.worker_version_id='${INF_VERSION_ID:-<unset>}'" >&2
            echo "If both upload steps were skipped or failed to emit worker_version_id=, fix the upload step before promote." >&2
            exit 1
          fi
          npx wrangler versions deploy "${VERSION_ID}@100" --env preview --yes \
            --message "IPI-825 auto-promote preview ${VERSION_ID}"
          DEPLOY_JSON=$(npx wrangler deployments list --env preview --json)
          export VERSION_ID DEPLOY_JSON
          python3 - <<'PY'
          import json, os, sys

          def parse_wrangler_json_array(raw: str):
              """Parse wrangler --json array; tolerate optional CLI banner text before JSON."""
              text = raw.strip()
              if not text:
                  raise ValueError("wrangler deployments list --json produced empty output")
              try:
                  data = json.loads(text)
                  if isinstance(data, list):
                      return data
                  raise ValueError(
                      f"expected JSON array from wrangler deployments list, got {type(data).__name__}"
                  )
              except json.JSONDecodeError:
                  pass
              decoder = json.JSONDecoder()
              for i, ch in enumerate(text):
                  if ch != "[":
                      continue
                  try:
                      data, _end = decoder.raw_decode(text, i)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(data, list):
                      return data
              preview = text[:240].replace("\n", "\\n")
              raise ValueError(
                  "could not parse JSON array from wrangler deployments list --json "
                  f"(first 240 chars: {preview!r})"
              )

          try:
              data = parse_wrangler_json_array(os.environ["DEPLOY_JSON"])
          except ValueError as exc:
              print(f"Error: {exc}", file=sys.stderr)
              sys.exit(1)
          data = sorted(data, key=lambda d: d.get("created_on", ""), reverse=True)
          if not data:
              print("Error: no preview deployments returned", file=sys.stderr)
              sys.exit(1)
          vers = data[0].get("versions") or []
          if not vers:
              print("Error: latest deployment has no versions", file=sys.stderr)
              sys.exit(1)
          live = vers[0].get("version_id")
          pct = vers[0].get("percentage")
          want = os.environ["VERSION_ID"]
          print(f"live_version_id={live}")
          print(f"live_percentage={pct}")
          if live != want or pct != 100:
              print(
                  f"Error: expected {want}@100%, got {live}@{pct}%",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          echo "promoted_version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "promoted_percentage=100" >> "$GITHUB_OUTPUT"

      - name: Record bootstrap artifacts for IPI-632
        # always(): keep version/URL/promote status in the summary when promote fails
        if: ${{ always() && inputs.dry_run == false }}
        run: |
          VERSION_ID="${{ steps.upload_github.outputs.worker_version_id || steps.upload_infisical.outputs.worker_version_id }}"
          PREVIEW_URL="${{ steps.upload_github.outputs.preview_url || steps.upload_infisical.outputs.preview_url }}"
          PROMOTED_ID="${{ steps.promote_preview.outputs.promoted_version_id }}"
          PROMOTED_PCT="${{ steps.promote_preview.outputs.promoted_percentage }}"
          if [ "${{ inputs.wrangler_env }}" = "preview" ] && [ "${{ inputs.promote_preview }}" = "true" ]; then
            PROMOTE_STATUS="${PROMOTED_ID:-failed}@${PROMOTED_PCT:-?}%"
          elif [ "${{ inputs.wrangler_env }}" = "production" ]; then
            PROMOTE_STATUS="skipped (production — manual / separately approved)"
          else
            PROMOTE_STATUS="skipped (promote_preview=false)"
          fi
          {
            echo "## Worker bootstrap (${{ inputs.wrangler_env }})"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Wrangler env | \`${{ inputs.wrangler_env }}\` |"
            echo "| Worker version ID | \`${VERSION_ID:-see logs}\` |"
            echo "| Preview URL | ${PREVIEW_URL:-see wrangler output} |"
            echo "| Promote (preview @100%) | ${PROMOTE_STATUS} |"
            echo ""
            echo "Next: IPI-632 protected preview smoke on the preview URL above."
            echo ""
            echo "Note: Dashboard bindings are not proof of the active traffic version — use \`wrangler deployments list --env preview\`."
          } >> "$GITHUB_STEP_SUMMARY"
