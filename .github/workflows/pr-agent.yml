---
name: PR Agent — Bedrock Qwen3 Coder Next (restricted)

on:
  pull_request:
    types: [opened, reopened, ready_for_review,synchronize]
  issue_comment:                      # manual commands (stage 2 allowlist) — gated below
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    # Auto path: non-draft, non-bot-authored PRs not carrying skip labels.
    # Actor checks match the event type: pull_request → pull_request.user.type (the PR
    # author), issue_comment → sender.type (the commenter).
    #
    # Manual path (stage 2): only the four token-boundary commands
    # (/review /describe /ask /improve) from OWNER/MEMBER/COLLABORATOR on a PR comment.
    # Token-boundary: the command must END the comment or be followed by a space, so
    # '/review-malicious' and '/asker' never match; command-flag text (e.g. '/review
    # --auto_approve') still starts with '/review ' and is rejected by restricted_mode.
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.user.type != 'Bot'
        && github.event.pull_request.draft == false
        && !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
        && !contains(github.event.pull_request.labels.*.name, 'docs-only')
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.sender.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (
          endsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/review ') ||
          endsWith(github.event.comment.body, '/describe') || startsWith(github.event.comment.body, '/describe ') ||
          endsWith(github.event.comment.body, '/ask') || startsWith(github.event.comment.body, '/ask ') ||
          endsWith(github.event.comment.body, '/improve') || startsWith(github.event.comment.body, '/improve ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@01569655d8b4825bbe599fd5b2a8de59d5c58390
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          aws.AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws.AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws.AWS_REGION_NAME: "us-east-1"
          # Note: no config.* env overrides — .pr_agent.toml (repo root, default branch)
          # is the single source of config truth; env here carries credentials/region only.
        # No actions/checkout — PR-Agent reads via GitHub APIs; issue_comment stays off
        # until GITHUB_TOKEN inherits from the PR branch (which it never does: the default
        # token only reads the default-branch context).
